gnb_du_id: $GNB_ID

f1ap:
  cu_cp_addr: $F1AP_CU_CP_ADDR
  bind_addr: $F1AP_BIND_ADDR

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://*:2000,rx_port=tcp://$RU_SDR_RX_PORT:2001,base_srate=11.52e6
  srate: 11.52
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 10
  common_scs: 15
  plmn: "00101"
  tac: 7
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 6
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  prach:
    prach_config_index: 1

log:
  filename: /tmp/du.log
  all_level: info                      # Mudar de warning para info
  phy_level: info                      # Info para ver métricas PHY
  mac_level: info                      # Info para ver métricas MAC
  broadcast_enabled: true              # TRUE - Mostra PRACH e broadcasts

pcap:
  mac_enable: false
  mac_filename: /tmp/du_mac.pcap
  f1ap_enable: false
  f1ap_filename: /tmp/du_f1ap.pcap
  f1u_enable: false
  f1u_filename: /tmp/du_f1u.pcap

e2:
  enable_du_e2: false
  addr: 10.0.2.10
  bind_addr: $E2_BIND_ADDR
  port: 36421
  e2sm_kpm_enabled: false
  e2sm_rc_enabled: false


